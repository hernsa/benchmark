id: debugging-001-offbyone
title: Fix the off-by-one bug
category: debugging
difficulty: easy
prompt: "The function below is supposed to return the sum of 1..n inclusive, but it\nhas an off-by-one bug:\n\n```python\ndef total(n: int) -> int:\n    return sum(range(n))\n```\n\nRespond with a single\
  \ ```python code block containing the FIXED function.\n"
expected_output: ''
eval:
