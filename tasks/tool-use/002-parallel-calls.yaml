id: tooluse-002-parallel-calls
title: Parallel tool calls
category: tool-use
difficulty: medium
prompt: "You have access to a tool:\n\n- get_weather(city: str, unit: str) - Get the current weather for a city.\n  - city: name of the city\n  - unit: temperature unit, \"celsius\" or \"fahrenheit\"\n\n\
  User request: \"Compare the weather in Paris and Tokyo, in celsius.\"\nThis requires two independent tool calls.\n\nRespond with ONLY a JSON array of call objects, in the order the user\nmentioned the\
  \ cities:\n[{\"name\": <tool name>, \"arguments\": {...}}, ...]\n"
expected_output: ''
eval:
  function_call:
    weight: 1.0
    calls:
    - function: get_weather
      args:
        city: Paris
        unit: celsius
    - function: get_weather
      args:
        city: Tokyo
        unit: celsius
    strict: true
