    weight: 1.0
    test_code: "from solution import total\n\n\ndef test_five():\n    assert total(5) == 15\n\n\ndef test_one():\n    assert total(1) == 1\n\n\ndef test_zero():\n    assert total(0) == 0\n\ndef test_ten():\n\
      \    assert total(10) == 55\n\ndef test_hundred():\n    assert total(100) == 5050\n"
