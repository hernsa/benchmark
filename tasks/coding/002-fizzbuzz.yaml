id: coding-002-fizzbuzz
title: FizzBuzz list
category: coding
difficulty: easy
prompt: 'Write a Python function `fizzbuzz(n: int) -> list[str]` that returns the

  FizzBuzz sequence from 1 to n inclusive: multiples of 3 become "Fizz",

  multiples of 5 become "Buzz", multiples of both become "FizzBuzz",

  everything else is the number as a string. fizzbuzz(0) returns an empty

  list.


  Respond with a single ```python code block containing the complete solution.

  '
expected_output: ''
eval:
  pytest:
    weight: 1.0
    test_code: "from solution import fizzbuzz\n\n\ndef test_small():\n    assert fizzbuzz(5) == [\"1\", \"2\", \"Fizz\", \"4\", \"Buzz\"]\n\n\ndef test_fifteen():\n    assert fizzbuzz(15)[-1] == \"FizzBuzz\"\
      \n\n\ndef test_zero():\n    assert fizzbuzz(0) == []\n\ndef test_one():\n    assert fizzbuzz(1) == [\"1\"]\n\ndef test_negative():\n    assert fizzbuzz(-5) == []\n\ndef test_thirty_counts():\n   \
      \ out = fizzbuzz(30)\n    assert out.count(\"FizzBuzz\") == 2\n    assert out.count(\"Fizz\") == 8\n    assert out.count(\"Buzz\") == 4\n\ndef test_all_strings():\n    assert all(isinstance(v, str)\
      \ for v in fizzbuzz(15))\n\ndef test_three():\n    assert fizzbuzz(3) == [\"1\", \"2\", \"Fizz\"]\n"
