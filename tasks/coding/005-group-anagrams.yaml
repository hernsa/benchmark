id: coding-005-group-anagrams
title: "Group anagrams"
category: coding
difficulty: hard
prompt: |
  Write a Python function `group_anagrams(words: list[str]) -> list[list[str]]`
  that groups anagrams together. For deterministic output: sort the words
  inside each group alphabetically, then sort the list of groups by their
  first element.

  Respond with a single ```python code block containing the complete solution.
expected_output: ""
eval:
  pytest:
    weight: 1.0
    test_code: |
      from solution import group_anagrams


      def test_standard():
          words = ["eat", "tea", "tan", "ate", "nat", "bat"]
          expected = [["ate", "eat", "tea"], ["bat"], ["nat", "tan"]]
          assert group_anagrams(words) == expected


      def test_empty():
          assert group_anagrams([]) == []


      def test_single():
          assert group_anagrams(["a"]) == [["a"]]
