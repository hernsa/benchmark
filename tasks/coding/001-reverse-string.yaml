id: coding-001-reverse-string
title: "Reverse a string"
category: coding
difficulty: easy
prompt: |
  Write a Python function `reverse_string(s: str) -> str` that returns the
  reverse of the input string.

  Respond with a single ```python code block containing the complete solution.
expected_output: ""
eval:
  pytest:
    weight: 1.0
    test_code: |
      from solution import reverse_string


      def test_basic():
          assert reverse_string("hello") == "olleh"


      def test_palindrome():
          assert reverse_string("racecar") == "racecar"


      def test_empty():
          assert reverse_string("") == ""


      def test_spaces():
          assert reverse_string("ab c") == "c ba"
