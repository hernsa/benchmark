id: coding-002-fizzbuzz
title: "FizzBuzz list"
category: coding
difficulty: easy
prompt: |
  Write a Python function `fizzbuzz(n: int) -> list[str]` that returns the
  FizzBuzz sequence from 1 to n inclusive: multiples of 3 become "Fizz",
  multiples of 5 become "Buzz", multiples of both become "FizzBuzz",
  everything else is the number as a string.

  Respond with a single ```python code block containing the complete solution.
expected_output: ""
eval:
  pytest:
    weight: 1.0
    test_code: |
      from solution import fizzbuzz


      def test_small():
          assert fizzbuzz(5) == ["1", "2", "Fizz", "4", "Buzz"]


      def test_fifteen():
          assert fizzbuzz(15)[-1] == "FizzBuzz"


      def test_zero():
          assert fizzbuzz(0) == []
