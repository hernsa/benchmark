[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-benchmark"
dynamic = ["version"]
description = "Benchmark runner for AI coding/debugging/tool-use agents with percentage scoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["typer>=0.9", "rich>=13", "pyyaml>=6", "httpx>=0.27", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
benchmark = "agent_benchmark.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "agent_benchmark.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
  "B008",    # typer builds CLI args via function calls in defaults, by design
  "TRY004",  # ValueError preferred for bad task configs (matches test expectations)
  "PLW1510", # subprocess returncode is parsed manually, not check=True
]
