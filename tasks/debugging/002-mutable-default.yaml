id: debugging-002-mutable-default
title: "Fix the mutable default argument"
category: debugging
difficulty: medium
prompt: |
  The function below is supposed to return a NEW list containing `item`,
  leaving any caller-provided list untouched, but it has the classic mutable
  default argument bug (state leaks between calls):

  ```python
  def append_to(item, lst=[]):
      lst.append(item)
      return lst
  ```

  Respond with a single ```python code block containing the FIXED function.
expected_output: ""
eval:
  pytest:
    weight: 1.0
    test_code: |
      from solution import append_to


      def test_fresh_default():
          assert append_to(1) == [1]


      def test_no_state_leak():
          assert append_to(2) == [2]


      def test_explicit_list():
          assert append_to("a", ["x"]) == ["x", "a"]
