id: coding-003-valid-parentheses
title: "Valid parentheses"
category: coding
difficulty: medium
prompt: |
  Write a Python function `is_valid(s: str) -> bool` that returns True if the
  input string of brackets '(', ')', '[', ']', '{', '}' is balanced and
  correctly nested, False otherwise. An empty string is valid.

  Respond with a single ```python code block containing the complete solution.
expected_output: ""
eval:
  pytest:
    weight: 1.0
    test_code: |
      from solution import is_valid


      def test_simple():
          assert is_valid("()") is True


      def test_mixed_ok():
          assert is_valid("()[]{}") is True


      def test_mismatch():
          assert is_valid("(]") is False


      def test_interleaved():
          assert is_valid("([)]") is False


      def test_nested():
          assert is_valid("{[]}") is True


      def test_empty():
          assert is_valid("") is True


      def test_unclosed():
          assert is_valid("(") is False
