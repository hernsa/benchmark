id: debugging-003-swallowed-exception
title: Fix the swallowed exception
category: debugging
difficulty: hard
prompt: "The function below is supposed to parse an integer, but it swallows the\nValueError that `int()` raises on bad input and returns None instead of\nletting the caller see the error:\n\n```python\n\
  def parse_int(s):\n    try:\n        return int(s)\n    except Exception:\n        return None\n```\n\nFix it so that valid input (including surrounding whitespace) returns the\ninteger and invalid input\
  \ raises ValueError. Respond with a single\n```python code block containing the FIXED function.\n"
expected_output: ''
eval:
  pytest:
    weight: 1.0
    test_code: "import pytest\n\nfrom solution import parse_int\n\n\ndef test_valid():\n    assert parse_int(\"42\") == 42\n\n\ndef test_whitespace():\n    assert parse_int(\" 7 \") == 7\n\n\ndef test_invalid_raises():\n\
      \    with pytest.raises(ValueError):\n        parse_int(\"abc\")\n\ndef test_plus_sign():\n    assert parse_int(\"+42\") == 42\n\ndef test_hex_raises():\n    try:\n        parse_int(\"0x10\")\n  \
      \      raised = False\n    except ValueError:\n        raised = True\n    assert raised\n\ndef test_float_str_raises():\n    try:\n        parse_int(\"3.5\")\n        raised = False\n    except ValueError:\n\
      \        raised = True\n    assert raised\n\ndef test_underscores():\n    assert parse_int(\"1_000\") == 1000\n"
