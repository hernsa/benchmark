id: coding-009-password-strength
title: Password strength analyzer with entropy
category: coding
difficulty: hard
prompt: 'Write a Python function `password_strength(s: str) -> float` that returns a

  percentage score from 0.0 to 100.0 based on password strength.


  Scoring rules (each criterion worth points, sum capped at 100):

  - Length: 0 if <=8 chars, 20 if 9-11, 40 if 12-14, 60 if 15-19, 100 if >=20

  - Has lowercase: 10 points

  - Has uppercase: 15 points

  - Has digit: 15 points

  - Has special: 20 points (chars in string.punctuation)

  - No char repeats more than 2 times: 10 points

  - Has mixed patterns: 10 points

  - Entropy bonus: 0.1 * unique_chars^1.5, max +15


  Example: "Abcdefghij123!@#$%^&*()_" (perfect score)

  Example: "a" (minimum with lowercase + entropy)


  IMPORTANT: Return a float, capped at 100.0


  Respond with a single ```python code block containing the complete solution.

  '
expected_output: ''
eval:
  pytest:
    weight: 1.0
    test_code: "from solution import password_strength\n\ndef test_tiny():\n    assert password_strength(\"a\") >= 20.0\n\ndef test_lowercase():\n    s = password_strength(\"abcdefgh\")\n    assert 20.0\
      \ <= s <= 30.0\n\ndef test_mixed_no_repeats():\n    s = password_strength(\"Password1!\")\n    assert s >= 85.0\n\ndef test_perfect():\n    assert password_strength(\"Abcdefghij123!@#$%^&*()_\") ==\
      \ 100.0\n\ndef test_repeat_penalty():\n    s = password_strength(\"aaaBbb1!\")\n    assert 65.0 <= s <= 80.0\n\ndef test_no_special():\n    s = password_strength(\"Password1\")\n    assert 75.0 <=\
      \ s <= 90.0\n\ndef test_short():\n    s = password_strength(\"x1!\")\n    assert 50.0 <= s <= 60.0\n\ndef test_empty():\n    assert round(password_strength(\"\"), 1) == 10.0\n\ndef test_twenty_lower():\n\
      \    assert password_strength(\"abcdefghijklmnopqrst\") == 100.0\n\ndef test_digits_only():\n    assert round(password_strength(\"12345678\"), 1) == 27.3\n\ndef test_specials_only():\n    assert round(password_strength(\"\
      !@#$%^*+\"), 1) == 32.3\n\ndef test_len9_boundary():\n    assert password_strength(\"Ab1!cDeFg\") == 100.0\n"
