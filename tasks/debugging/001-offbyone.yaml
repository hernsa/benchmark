id: debugging-001-offbyone
title: "Fix the off-by-one bug"
category: debugging
difficulty: easy
prompt: |
  The function below is supposed to return the sum of 1..n inclusive, but it
  has an off-by-one bug:

  ```python
  def total(n: int) -> int:
      return sum(range(n))
  ```

  Respond with a single ```python code block containing the FIXED function.
expected_output: ""
eval:
  pytest:
    weight: 1.0
    test_code: |
      from solution import total


      def test_five():
          assert total(5) == 15


      def test_one():
          assert total(1) == 1


      def test_zero():
          assert total(0) == 0
