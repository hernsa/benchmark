id: coding-004-binary-search
title: "Binary search"
category: coding
difficulty: medium
prompt: |
  Write a Python function `binary_search(arr: list[int], target: int) -> int`
  that returns the index of `target` in the sorted list `arr`, or -1 if it is
  not present. Correctness is what is scored; aim for O(log n) time.

  Respond with a single ```python code block containing the complete solution.
expected_output: ""
eval:
  pytest:
    weight: 1.0
    test_code: |
      from solution import binary_search


      def test_found():
          assert binary_search([1, 3, 5, 7, 9], 5) == 2


      def test_missing():
          assert binary_search([1, 3, 5, 7, 9], 4) == -1


      def test_empty():
          assert binary_search([], 1) == -1


      def test_first():
          assert binary_search([1, 3, 5, 7, 9], 1) == 0


      def test_last():
          assert binary_search([1, 3, 5, 7, 9], 9) == 4
