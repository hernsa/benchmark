id: debugging-004-pipeline-order
title: Pipeline order bug
category: debugging
difficulty: hard
prompt: "The following function is supposed to return items sorted by their\n\"priority\" field (1=high, 5=low). But it has a subtle ordering bug.\n\ndef get_sorted_items():\n    items = [\n        {\"\
  name\": \"urgent\", \"priority\": 1},\n        {\"name\": \"normal\", \"priority\": 3},\n        {\"name\": \"low\", \"priority\": 5},\n    ]\n    # Bug: items are sorted by name instead of priority\n\
  \    return sorted(items, key=lambda x: x[\"name\"])\n\nIdentify and fix the bug. The fixed function should return items\nin priority order: urgent, normal, low.\n\nRespond with a single ```python code\
  \ block containing the FIXED solution.\n"
expected_output: ''
eval:
  pytest:
    weight: 1.0
    test_code: "from solution import get_sorted_items\n\ndef test_priority_order():\n    result = get_sorted_items()\n    assert result[0][\"name\"] == \"urgent\"\n    assert result[1][\"name\"] == \"normal\"\
      \n    assert result[2][\"name\"] == \"low\"\n\ndef test_priority_values():\n    result = get_sorted_items()\n    priorities = [item[\"priority\"] for item in result]\n    assert priorities == [1,\
      \ 3, 5]  # Must be in order\n\ndef test_idempotent():\n    assert get_sorted_items() == get_sorted_items()\n"
