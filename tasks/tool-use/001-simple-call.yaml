id: tooluse-001-simple-call
title: Single tool call
category: tool-use
difficulty: easy
prompt: "You have access to a tool:\n\n- get_weather(city: str, unit: str) - Get the current weather for a city.\n  - city: name of the city\n  - unit: temperature unit, \"celsius\" or \"fahrenheit\"\n\n\
  User request: \"What's the weather in Paris, in celsius?\"\n\nRespond with ONLY a JSON object of the form:\n{\"name\": <tool name>, \"arguments\": {<arg>: <value>, ...}}\n"
expected_output: ''
eval:
  function_call:
    weight: 1.0
    function: get_weather
    args:
      city: Paris
      unit: celsius
    strict: true
